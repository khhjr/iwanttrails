# Navigation bar. TODO make configurable.
navbar:
  title: iwanttrails.com # Page title.

# Home section with background images.
home:
  href: home
  text: <h1>Your land deserves a trail worth using every day.</h1>
        <h1>Custom trail design and construction for private landowners across western North Carolina.</h1>
        <br>
        <a href="#contact" class="frosted-btn btn-lg">Get a Free Consultation</a>
  image: static/img/home.jpg
  image_mobile: static/img/home.jpg

# List of configurable sections and background images.
sections:
- name: Trail Types
  href: trails
  type: bullets # Type of section, bullets or modal buttons
  justify_topics: center
  image: static/img/types.jpg
  image_mobile: static/img/types.jpg
  title: Every property is different. I build trails that work with your terrain, not against it.
  bullets:
    - Hiking and walking trails
    - Mountain bike trails and flow lines
    - Singletrack and wide trails
    - Switchbacks and contour trails
    - Equestrian trails
    - ATV / UTV routes
- name: Benefits
  href: benefits
  type: bullets
  justify_topics: center
  image: static/img/services/construction/d01-finished.jpg
  image_mobile: static/img/services/construction/d01-finished.jpg
  title: A trail changes how you experience your land. Most landowners tell me they use their property far more after a trail goes in.
  bullets:
    - Enjoy private outdoor recreation
    - Improve physical and mental wellbeing
    - Increase land value and usability
    - Provide access to remote acreage
    - Aid in fire prevention and control
- name: Services # Name of section displayed in a list box that scrolls over bg image.
  type: modal
  href: services # Must match NAVBAR href.
  justify_topics: start # Position of list box.
  image: static/img/services.jpg # Desktop bg image.
  image_mobile: static/img/services.jpg # Mobile bg image.
  # Each section has a list of topics with associated directories.
  # Within each directory can be multiple images and associated captions.
  # e.g., image1.jpg and image1.txt, alpha-numeric ordered.
  topics:
  - name: Trail Construction
    path: static/img/services/construction
  - name: Trail Consulting
    path: static/img/services/consulting
  - name: Trail Repairs
    path: static/img/services/repairs
  - name: Small Projects
    path: static/img/services/projects
  - name: Areas Served
    path: static/img/abouts/areas
- name: Testimonials
  type: paragraph
  href: testimonials
  justify_topics: center
  image: static/img/testi.jpg
  image_mobile: static/img/testi.jpg
  title: What clients say
  bullets:
    - <q>Kyle did an amazing job! Took me through the process step by step. The end product was an amazing trail that I use everyday</q>
    - "⭐⭐⭐⭐⭐ - Joe from Google reviews"
- name: About Me
  type: modal
  href: abouts
  justify_topics: end
  image: static/img/abouts.jpg
  image_mobile: static/img/abouts.jpg
  topics:
  - name: Background
    path: static/img/abouts/background
  - name: Experience
    path: static/img/abouts/experience
  - name: Tools
    path: static/img/abouts/tools
- name: Gallery
  type: single
  href: gallery
  justify_topics: center
  image: static/img/gallery.jpg
  image_mobile: static/img/gallery.jpg
  paths: [static/img/gallery,]
  images: [] # Will be filled by app.py.
- name: Videos
  type: single
  href: videos
  justify_topics: begin
  image: static/img/videos.jpg
  image_mobile: static/img/videos.jpg
  path: static/img/videos # list of youtube links and descriptions.
  videos: [] # Will be filled by app.py.

# Contact section, may require updating contact.html and app.py for your application.
contact:
  type: list
  justify_topics: end
  image: static/img/contact.jpg
  image_mobile: static/img/contact.jpg

